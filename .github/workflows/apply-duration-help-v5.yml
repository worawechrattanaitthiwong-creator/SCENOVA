name: Apply Duration Help V5

on:
  push:
    paths:
      - ".github/workflows/apply-duration-help-v5.yml"

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move duration explanation into seconds info
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/single-episode-studio.tsx")
          text = path.read_text()

          old_seconds = '''            <div className={styles.secondsInput}><input type="number" min={1} max={180} step={1} value={totalDuration} onChange={(event) => changeTotalDuration(Number(event.target.value))} /><b>วินาที</b></div>\n            <small>เลือกได้อิสระ 1–180 วินาที (สูงสุด 3 นาที)</small>'''
          new_seconds = '''            <div className={styles.secondsInput}><input type="number" min={1} max={180} step={1} value={totalDuration} onChange={(event) => changeTotalDuration(Number(event.target.value))} /><b data-sc-help={`${model} รองรับสูงสุด ${providerMaxSeconds} วินาทีต่อคลิป ระบบเพิ่มฉากให้อัตโนมัติเมื่อเวลารวมยาวกว่าที่ API สร้างได้ต่อครั้ง`} data-sc-help-label="วินาที">วินาที</b></div>'''

          old_summary = '''          <div className={styles.timingSummary}>\n            <strong>{totalDuration} วินาที • {scenes.length} ฉาก</strong>\n            <span>{model} รองรับสูงสุด {providerMaxSeconds} วินาทีต่อคลิป ระบบเพิ่มฉากให้อัตโนมัติเมื่อเวลารวมยาวกว่าที่ API สร้างได้ต่อครั้ง</span>\n          </div>\n'''

          if old_seconds not in text:
              raise SystemExit("duration helper block not found")
          if old_summary not in text:
              raise SystemExit("timing summary block not found")

          text = text.replace(old_seconds, new_seconds, 1)
          text = text.replace(old_summary, "", 1)
          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/single-episode-studio.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Move duration help into seconds tooltip"
          git push origin HEAD:main
