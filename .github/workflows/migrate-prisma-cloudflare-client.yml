name: Migrate Prisma Cloudflare Client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Migrate Prisma generator and imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          schema = Path('prisma/schema.prisma')
          text = schema.read_text()
          text = re.sub(
              r'generator client \{.*?\n\}',
              '''generator client {
            provider     = "prisma-client"
            output       = "../generated/prisma"
            runtime      = "cloudflare"
            engineType   = "client"
            moduleFormat = "esm"
          }''',
              text,
              count=1,
              flags=re.S,
          )
          schema.write_text(text)

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.mts', '.cts'}:
                  continue
              if any(part in {'node_modules', '.next', '.open-next', 'generated'} for part in path.parts):
                  continue
              source = path.read_text()
              updated = source.replace('from "@prisma/client"', 'from "@/generated/prisma/client"')
              updated = updated.replace("from '@prisma/client'", "from '@/generated/prisma/client'")
              if updated != source:
                  path.write_text(updated)

          gitignore = Path('.gitignore')
          ignore = gitignore.read_text()
          if '\ngenerated\n' not in '\n' + ignore:
              ignore = ignore.rstrip() + '\n\n# Generated Prisma client\ngenerated\n'
              gitignore.write_text(ignore)

          package = Path('package.json')
          data = json.loads(package.read_text())
          scripts = data.setdefault('scripts', {})
          scripts['prebuild:cloudflare'] = 'prisma generate'
          scripts['prepreview'] = 'prisma generate'
          scripts['preupload'] = 'prisma generate'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - run: npm ci
      - run: npm run db:generate
      - name: Verify generated Cloudflare client
        shell: bash
        run: |
          test -f generated/prisma/client.ts
          python - <<'PY'
          from pathlib import Path

          generated = Path('generated/prisma/internal/class.ts').read_text()
          if '"runtime": "cloudflare"' not in generated:
              raise SystemExit('Generated Prisma client is not targeting Cloudflare')

          offenders = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.mts', '.cts'}:
                  continue
              if any(part in {'node_modules', '.next', '.open-next', 'generated'} for part in path.parts):
                  continue
              source = path.read_text()
              if 'from "@prisma/client"' in source or "from '@prisma/client'" in source:
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('Legacy @prisma/client imports remain: ' + ', '.join(offenders))
          print('Cloudflare Prisma client verified')
          PY
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:cloudflare
      - name: Remove one-shot workflow
        run: rm .github/workflows/migrate-prisma-cloudflare-client.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Cloudflare-targeted Prisma client" || exit 0
          git push origin HEAD:main
