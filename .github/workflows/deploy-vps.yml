name: Deploy SCENOVA Main to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: scenova-main-production-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main to Hostinger VPS
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | tr -d '\r\n ' | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          : > ~/.ssh/known_hosts
          scan_ok=0
          for attempt in 1 2 3 4 5; do
            if timeout 12 ssh-keyscan -T 8 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              scan_ok=1
              break
            fi
            echo "SSH host-key scan attempt ${attempt}/5 failed; retrying..."
            sleep $((attempt * 2))
          done
          if [ "$scan_ok" -ne 1 ]; then
            echo "ERROR: unable to collect VPS SSH host key after 5 attempts"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy SCENOVA main
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail

            cd /home/scenova/app

            if [ ! -f .env.production ]; then
              echo "ERROR: /home/scenova/app/.env.production is missing"
              exit 1
            fi

            git fetch origin main
            git checkout -B main FETCH_HEAD

            node scripts/prepare-vps-runtime.mjs
            npm ci
            npm run db:generate
            npm run typecheck
            npm run test
            npm run build

            pm2 reload ecosystem.config.cjs --update-env
            pm2 save

            sleep 2
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:3000/api/health/db
            echo
            echo "SCENOVA main VPS deploy completed successfully"
          REMOTE

      - name: Verify public production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-all-errors \
            https://scnva.com/api/health/db
          echo