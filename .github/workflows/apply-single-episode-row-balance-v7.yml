name: Apply Single Episode Row Balance V7

on:
  push:
    paths:
      - ".github/workflows/apply-single-episode-row-balance-v7.yml"

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Balance setup rows and compact aspect picker
        shell: python
        run: |
          from pathlib import Path

          css_path = Path("app/single-episode-options-v2.css")
          css = css_path.read_text()
          marker = "/* Single Episode row balance v7 */"
          if marker not in css:
              css += '''

/* Single Episode row balance v7 */
.sc-ratio-trigger-copy small{display:none!important}
.sc-ratio-trigger{height:38px!important;min-height:38px!important;padding:3px 8px!important;gap:8px!important}
.sc-ratio-frame-shell{width:40px!important;height:30px!important;flex-basis:40px!important}
.sc-ratio-trigger-copy strong{font-size:13px!important;line-height:1.2!important}
@media (min-width:981px){
  #setup [class*="single-episode-studio_setupGrid"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  #setup [class*="single-episode-studio_setupGrid"]>[class*="single-episode-studio_field"]:nth-child(-n+4){grid-column:auto!important}
  #setup [class*="single-episode-studio_storyField"]{grid-column:1/3!important}
  #setup [class*="single-episode-studio_episodeTiming"]{grid-column:3/5!important}
}
'''
              css_path.write_text(css)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/single-episode-options-v2.css
          git diff --cached --quiet && exit 0
          git commit -m "Balance single episode setup rows"
          git push origin HEAD:main
