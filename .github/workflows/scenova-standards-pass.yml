name: SCENOVA Standards Pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scenova-standards-pass.yml"

permissions:
  contents: write

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply standards pass
        run: python scripts/apply-standards-pass.py

      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:cloudflare

      - name: Commit validated standards pass
        shell: bash
        run: |
          rm .github/workflows/scenova-standards-pass.yml
          rm scripts/apply-standards-pass.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish SCENOVA UX and Library resilience"
          git push origin main

      - name: Deploy validated build to Cloudflare
        run: npm run deploy
