name: Apply Single Episode Layout V4

on:
  push:
    paths:
      - "scripts/apply-single-episode-layout-v4.mjs"
      - ".github/workflows/apply-single-episode-layout-v4.yml"

permissions:
  contents: write

jobs:
  patch-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Studio layout V4
        run: node scripts/apply-single-episode-layout-v4.mjs
      - name: Commit patched Studio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/single-episode-studio.tsx components/single-episode-studio.module.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine Single Episode controls layout"
          git push origin HEAD:main
