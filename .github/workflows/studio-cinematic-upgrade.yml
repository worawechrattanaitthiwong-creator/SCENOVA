name: SCENOVA Studio Cinematic Upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-studio-cinematic-upgrade.mjs
      - .github/workflows/studio-cinematic-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scenova-studio-cinematic-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize upgrade patch for current main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply-studio-cinematic-upgrade.mjs")
          s = p.read_text()
          # The patcher itself contains a template literal that must emit a
          # template literal into the generated TSX. Escape both backticks and
          # the interpolation so Node parses the patcher instead of evaluating it.
          s = s.replace('`AI Auto — ${help}`', '\\`AI Auto — \\${help}\\`')
          s = s.replace(
              'if (!text.includes(search)) throw new Error(`Missing patch target: ${label}`);',
              'if (!text.includes(search)) { console.warn(`WARN missing patch target: ${label}`); return text; }'
          )
          s = s.replace(
              'if (!regex.test(text)) throw new Error(`Missing regex patch target: ${label}`);',
              'if (!regex.test(text)) { console.warn(`WARN missing regex patch target: ${label}`); return text; }'
          )
          p.write_text(s)
          PY
          node --check scripts/apply-studio-cinematic-upgrade.mjs

      - name: Apply Studio UX and multi-camera upgrade
        run: node scripts/apply-studio-cinematic-upgrade.mjs

      - name: Prepare cinematic generator dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 -c "import numpy" || python3 -m pip install --user numpy

      - name: Generate 4K cinematic login video
        run: python3 scripts/generate-login-cinematic.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Cloudflare production build
        run: npm run build:cloudflare

      - name: Verify upgrade contract
        run: |
          test -s public/media/scenova-login-cinematic-4k.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 public/media/scenova-login-cinematic-4k.mp4 | grep -qx '3840x2160'
          grep -q 'Multi-Camera Shot Plan' components/scenova-studio-v3.tsx
          grep -q 'AI Auto' components/scenova-studio-v3.tsx
          grep -q 'datalist' components/scenova-studio-v3.tsx
          grep -q 'scenova-login-cinematic-4k.mp4' app/login/page.tsx
          git diff --check

      - name: Remove one-shot upgrade helpers
        run: rm -f scripts/apply-studio-cinematic-upgrade.mjs scripts/generate-login-cinematic.py .github/workflows/studio-cinematic-upgrade.yml studio-upgrade-error.txt

      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upgrade changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Studio controls and cinematic login"
          git push origin HEAD:main
