name: SCENOVA Studio Cinematic Upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-studio-cinematic-upgrade.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scenova-studio-cinematic-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Studio UX and multi-camera upgrade
        run: node scripts/apply-studio-cinematic-upgrade.mjs

      - name: Prepare cinematic generator dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 - <<'PY'
          try:
              import numpy  # noqa: F401
          except Exception:
              raise SystemExit(1)
          PY
        continue-on-error: true

      - name: Ensure numpy
        run: python3 -c "import numpy" || python3 -m pip install --user numpy

      - name: Generate 4K cinematic login video
        run: python3 scripts/generate-login-cinematic.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Cloudflare production build
        run: npm run build:cloudflare

      - name: Verify generated cinematic asset
        run: |
          test -s public/media/scenova-login-cinematic-4k.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 public/media/scenova-login-cinematic-4k.mp4 | grep -qx '3840x2160'
          git diff --check

      - name: Remove one-shot upgrade helpers
        run: rm -f scripts/apply-studio-cinematic-upgrade.mjs scripts/generate-login-cinematic.py .github/workflows/studio-cinematic-upgrade.yml

      - name: Commit validated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upgrade changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Studio controls and cinematic login"
          git push origin HEAD:main
