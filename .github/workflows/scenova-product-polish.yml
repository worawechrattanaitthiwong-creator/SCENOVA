name: SCENOVA Product Polish

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-product-polish.py"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply product polish
        run: python scripts/apply-product-polish.py
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:cloudflare
      - name: Commit validated polish
        shell: bash
        run: |
          rm .github/workflows/scenova-product-polish.yml
          rm scripts/apply-product-polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Raise SCENOVA product UX standards"
          git push origin main
      - name: Deploy validated build to Cloudflare
        run: npm run deploy
