name: Fix Prisma Cloudflare engine

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-prisma-cloudflare-engine.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Rust-free Prisma client for Cloudflare
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prisma/schema.prisma')
          text = path.read_text()
          old = 'generator client {\n  provider = "prisma-client-js"\n}'
          new = 'generator client {\n  provider   = "prisma-client-js"\n  engineType = "client"\n}'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'engineType = "client"' not in text:
              raise SystemExit('Unexpected Prisma generator block; refusing unsafe edit')
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-prisma-cloudflare-engine.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma .github/workflows/fix-prisma-cloudflare-engine.yml
          git commit -m "Use Rust-free Prisma client on Cloudflare"
          git push origin HEAD:main
